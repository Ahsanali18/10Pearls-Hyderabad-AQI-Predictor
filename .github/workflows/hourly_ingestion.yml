name: Hourly AQI Data Fetch

on:
  schedule:
    - cron: '5 * * * *'  #Every hour at minute 5
  workflow_dispatch:     #Manual trigger

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live pipeline
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
          MONGO_COLLECTION: ${{ secrets.MONGO_COLLECTION }}
          MONGO_MODELS_COLLECTION: ${{ secrets.MONGO_MODELS_COLLECTION }}
        run: python -m src.pipelines.live_pipeline
